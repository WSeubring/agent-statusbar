<svg width="1600" height="960" viewBox="0 0 1600 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="terminal" x1="160" y1="170" x2="1440" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1600" height="960" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="960" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="140" y="140" width="1320" height="680" rx="28" fill="url(#terminal)" stroke="#1F2937"/>
    <rect x="140" y="140" width="1320" height="68" rx="28" fill="#111827"/>
    <rect x="140" y="180" width="1320" height="28" fill="#111827"/>

    <circle cx="186" cy="174" r="8" fill="#F87171"/>
    <circle cx="214" cy="174" r="8" fill="#FBBF24"/>
    <circle cx="242" cy="174" r="8" fill="#34D399"/>

    <text x="800" y="182" text-anchor="middle" fill="#94A3B8" font-family="JetBrainsMono Nerd Font, Noto Sans Mono, monospace" font-size="22">agent-statusbar</text>
  </g>

  <text x="160" y="96" fill="#E5E7EB" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="700">Personal status bars for coding agents</text>
  <text x="160" y="126" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="22">Representative screenshot of the current Claude Code and pi integrations</text>

  <g transform="translate(190 270)" font-family="JetBrainsMono Nerd Font, Noto Sans Mono, monospace">
    <text x="0" y="0" fill="#64748B" font-size="22" xml:space="preserve">$ python3 integrations/claude/bin/statusbar.py --demo</text>

    <text x="0" y="54" font-size="24" xml:space="preserve">
      <tspan fill="#C4B5FD" font-weight="700">AGENT</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#93C5FD">Claude Sonnet 4</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#FBBF24">ctx [#######---</tspan>
      <tspan fill="#64748B">] 68%</tspan>
    </text>

    <text x="0" y="92" font-size="22" xml:space="preserve">
      <tspan fill="#F59E0B">session 54%</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#FB7185">weekly 81%</tspan>
    </text>

    <rect x="-12" y="124" width="1224" height="1" fill="#1E293B"/>

    <text x="0" y="188" fill="#64748B" font-size="22" xml:space="preserve">$ pi</text>

    <text x="0" y="242" font-size="20" xml:space="preserve">
      <tspan fill="#A78BFA" font-weight="700">PI</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#93C5FD">Claude Sonnet 4</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#FBBF24">ctx [#####---</tspan>
      <tspan fill="#64748B">] 68% 143.2k</tspan>
    </text>

    <text x="0" y="280" font-size="20" xml:space="preserve">
      <tspan fill="#F59E0B">session 54%</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#FB7185">weekly 81%</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#64748B">in 512.4k</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#64748B">out 38.1k</tspan>
    </text>

    <text x="0" y="318" font-size="20" xml:space="preserve">
      <tspan fill="#64748B">$2.173</tspan>
      <tspan fill="#475569"> | </tspan>
      <tspan fill="#94A3B8">branch main</tspan>
    </text>

    <rect x="-12" y="356" width="1224" height="1" fill="#1E293B"/>

    <text x="0" y="426" fill="#94A3B8" font-size="22" xml:space="preserve">Small, readable, and easy to copy into your own setup.</text>
    <text x="0" y="470" fill="#64748B" font-size="20" xml:space="preserve">Repo: github.com/WSeubring/agent-statusbar</text>
  </g>
</svg>
